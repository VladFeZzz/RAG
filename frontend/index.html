<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music RAG Assistant</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-wrapper">
      <header>
        <h1>Music AI Assistant</h1>
        <p>Музичний експерт на базі RAG</p>
      </header>

      <div class="upload-container">
        <div class="upload-box">
          <label for="pdfInput" class="upload-label"> Оберіть PDF-файл </label>
          <input type="file" id="pdfInput" accept=".pdf" hidden />
          <span id="fileName">Файл не обрано</span>
          <button onclick="uploadPDF()" class="upload-btn">
            Завантажити в базу
          </button>
        </div>
        <p id="uploadStatus"></p>
      </div>

      <div class="chat-container" id="chatBox">
        <div class="message bot">
          <div class="bubble">
            Привіт! Я готовий відповідати на питання. <br />
            Завантаж PDF зверху або просто запитай щось про музику.
          </div>
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="userInput"
          placeholder="Напиши своє питання..."
          autocomplete="off"
        />
        <button onclick="sendMessage()" id="sendBtn">Send</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
